<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home/1</title>
<link rel="icon" type="image/svg+xml" href="/home1-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #ffffff; color: #000;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: 40px 24px 60px;
  }
  .wrap { width: 100%; max-width: 1024px; }

  /* header — the Home/1 logo lockup with the tagline beside it, poem.town-style */
  .header { margin-bottom: 22px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .header .logo { width: clamp(190px, 26vw, 290px); height: auto; display: block; }
  .header .sub { margin: 0; font-size: clamp(16px, 2.2vw, 24px); font-weight: 500; color: #000; }

  /* shelf render */
  .stage {
    position: relative; width: 100%; aspect-ratio: 2400 / 1350;
    border-radius: 4px; overflow: hidden; container-type: inline-size;
  }
  .stage img.shelf { width: 100%; height: 100%; display: block; object-fit: cover; }
  .stage.noimg { background: linear-gradient(180deg, #b8a489 0 58%, #cbb79a 58% 100%); }
  .stage.noimg::before {
    content: ''; position: absolute; left: 31%; top: 33%; width: 38%; height: 33%;
    background: #efeee9; border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .stage.noimg .screen { background: #e7e5dd; }
  .hintimg { display: none; }
  .stage.noimg .hintimg {
    display: block; position: absolute; left: 0; right: 0; bottom: 6px;
    text-align: center; font-size: 11px; color: #5b4d3a;
  }

  /* e-paper screen overlay — poem.town's geometry + matrix3d transform */
  .screen {
    position: absolute;
    left: 31.85%; top: 39.7%; width: 20.7%; height: 24.0%;
    transform-origin: 50% 50%;
    transform: matrix3d(0.997801, -0.065945, -0.0065945, 2.73631e-05, 0.065945, 0.997823, -0.000217676, 9.03222e-07, 0.0065945, -0.000217676, 0.999978, -0.00414929, 0, 0, 0, 1);
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 1.2cqw 1.4cqw 0.6cqw 1.0cqw;
    text-align: left; overflow: hidden; cursor: pointer;
  }
  .poem {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-weight: 600; color: #292524; line-height: 1.34; white-space: pre-line;
    font-size: clamp(7px, 1.45cqw, 20px);
  }
  .poem.serif { font-family: 'Newsreader', Georgia, serif; font-weight: 500; }
  .poem.flash { animation: eink .5s steps(2,end); }
  @keyframes eink { 0%,49%{filter:invert(1) contrast(1.4)} 50%,100%{filter:none} }

  .heartpulse {
    position: absolute; left: 41%; top: 51.7%; transform: translate(-50%,-50%) scale(.4);
    color: #c0392b; opacity: 0; pointer-events: none;
  }
  .heartpulse svg { width: 5cqw; height: 5cqw; }
  .heartpulse.go { animation: pulse 1s ease-out; }
  @keyframes pulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    25% { opacity: .95; transform: translate(-50%,-50%) scale(1.1); }
    60% { opacity: .9; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); }
  }
  .deviceHit { position: absolute; left: 28%; top: 30%; width: 35%; height: 36%; background: transparent; border: none; cursor: pointer; }
  .deviceHit:focus-visible { outline: 2px solid rgba(0,0,0,.25); border-radius: 8px; }

  /* caption + controls under the render */
  .caption { margin: 16px 2px 0; color: #6f6b63; font-size: 14px; }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .status { display:flex; align-items:center; gap:7px; font-size:13px; color:#6f6b63; margin-right:4px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#bbb; }
  .dot.on { background:#5e8f68; } .dot.err { background:#c0503f; }
  button {
    background:#fff; color:#1c1b18; border:1px solid #e2ddd3; border-radius:8px;
    padding:8px 14px; font:inherit; font-size:13px; cursor:pointer;
  }
  button.primary { background:#5e8f68; color:#fff; border:none; font-weight:600; }
  button:hover { filter: brightness(0.98); }
  button.primary:hover { filter: brightness(1.05); }
  .panel { display:none; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .panel.open { display:flex; }
  .panel input, .panel select { background:#fff; color:#1c1b18; border:1px solid #e2ddd3; border-radius:7px; padding:6px 9px; font:inherit; font-size:13px; }
  label.f { font-size:12px; color:#6f6b63; display:flex; gap:6px; align-items:center; }
  .saved { color:#5e8f68; font-size:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img class="logo" src="/home1-logo.svg" alt="Home/1" />
      <p class="sub">Your home’s AI rhyming clock</p>
    </div>

    <div class="stage" id="stage">
      <img class="shelf" src="/poem-shelf.jpg" alt="Poem/1 on a shelf"
           onerror="this.style.display='none';document.getElementById('stage').classList.add('noimg')" />
      <div class="screen" id="screen"><div class="poem" id="poem"></div></div>
      <div class="heartpulse" id="heartpulse">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.7-10-9.3C.4 8.4 2 5 5.2 5c2 0 3.3 1.2 4 2.3C9.7 6.2 11 5 13 5c3.2 0 4.8 3.4 3.2 6.7C18.5 16.3 12 21 12 21z"/></svg>
      </div>
      <button class="deviceHit" id="deviceHit" title="Tap the device to save this poem" aria-label="Save this poem"></button>
      <div class="hintimg">Run <code>npm run fetch:shelf</code> for the shelf render.</div>
    </div>

    <p class="caption">The render above updates every minute — just like poem.town. Tap the device (or ♥ Save) to keep a poem.</p>

    <div class="bar">
      <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
      <button class="primary" id="save">♥ Save</button>
      <button id="refresh">Compose now</button>
      <button id="gear">⚙ Device</button>
      <span class="saved" id="savedmsg"></span>
    </div>
    <div class="panel" id="panel">
      <label class="f">screenId <input id="screenId" value="SIM-BROWSER-01" size="14"></label>
      <label class="f">token <input id="token" value="poem.dummyKey" size="12"></label>
      <button id="apply">apply</button>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let state = { screenId:'SIM-BROWSER-01', token:'poem.dummyKey', poemId:null, liked:false, asleep:false };

function setConn(s) {
  $('dot').className = 'dot ' + (s==='ok'?'on':s==='err'?'err':'');
  $('conn').textContent = s==='ok'?'online':s==='err'?'offline':'connecting…';
}
function time24() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
async function api(path, body) {
  return fetch('/api/v1/clock'+path, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+state.token },
    body: JSON.stringify(body),
  });
}
let lastNote = null;
async function compose() {
  try {
    const res = await api('/compose', { screenId: state.screenId, time24: time24() });
    if (!res.ok) { setConn('err'); return; }
    render(await res.json());
    setConn('ok');
  } catch { setConn('err'); }
}
function render(d) {
  const p = $('poem');
  p.className = 'poem ' + (d.preferredFont==='PLAYFAIR'?'serif':'') + ' flash';
  state.asleep = !!d.screensaver;
  p.textContent = state.asleep ? '' : (d.poem||'').replace(/ \/ /g, '\n');
  setTimeout(()=>p.classList.remove('flash'), 500);
  state.poemId = d.poemId; state.liked = false;
  $('savedmsg').textContent = '';
  if (d.note && d.note.noteId && d.note.noteId !== lastNote) {
    lastNote = d.note.noteId;
    api('/notes/'+d.note.noteId+'/seen', { screenId: state.screenId }).catch(()=>{});
  }
}
async function save() {
  if (!state.poemId || state.asleep) return;
  const res = await api('/likes/'+state.poemId+'/mark', { screenId: state.screenId });
  if (res.ok) {
    state.liked = true;
    const h = $('heartpulse'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go');
    $('savedmsg').textContent = 'Saved ♥ — kept in your dashboard.';
  } else if (res.status === 403) {
    $('savedmsg').innerHTML = '<span style="color:#b07b2e">Claim '+state.screenId+' in the dashboard to save poems.</span>';
  }
}
$('save').onclick = save;
$('deviceHit').onclick = save;
$('refresh').onclick = compose;
$('gear').onclick = () => $('panel').classList.toggle('open');
$('apply').onclick = () => {
  state.screenId = $('screenId').value.trim()||'SIM-BROWSER-01';
  state.token = $('token').value.trim()||'poem.dummyKey';
  boot();
};
async function boot() {
  setConn('connecting');
  try { await api('/status', { screenId: state.screenId, buildId: 'sim-1.0' }); } catch {}
  await compose();
}
function scheduleMinute() {
  const d = new Date();
  const ms = 60000 - (d.getSeconds()*1000 + d.getMilliseconds());
  setTimeout(()=>{ compose(); scheduleMinute(); }, ms);
}
boot();
scheduleMinute();
</script>
</body>
</html>
