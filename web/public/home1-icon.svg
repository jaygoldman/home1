<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Home/1">
  <!-- Square favicon derived from the Home/1 logo: the house + e-paper screen
       window, no wordmark, in the logo's colours. -->
  <!-- cream body -->
  <rect x="20" y="49" width="80" height="52" rx="8" fill="#e3dfd4"/>
  <!-- e-paper screen window, centred -->
  <rect x="31" y="58" width="58" height="33" rx="4" fill="#c6ccc8" stroke="#b0b0aa" stroke-width="2.5"/>
  <!-- green gable roofline (open peaked stroke, like the logo) -->
  <polyline points="13 52 60 21 107 52" fill="none" stroke="#5aba4e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
